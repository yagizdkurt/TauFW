taufw_config:                     # set by the maintainers: analysts edit the values below, never these lines
  id: histogrammer.setup_mutau
  version: 1
  schema: 1
  description: fillhists.py channel setup mutau (channel, tag, baseline cuts, regions)
##
## CMSDAS26 Z -> tau_mu tau_h: the mutau selection of the long exercise (Plotter/config/cmsdas_mutau.yml there).
## fillhists.py makes one selection per region: baselineCuts && definition.
##

channel: mutau
tag: ""

# Option B, used: the "hybrid" selection of the exercise team (PNet against jets, DeepTau against electrons and
# muons), as filled in during the exercise: the signalRegion of its cmsdas_mutau.yml, the same as the baselineCuts of
# long-ex Fitter/TauES_ID/config/config_coarse_TT_hybrid.yml, with which the team measured its own scale factors
# (Tier B of step 7): sf/TauCorrections_2024_corrTES_noCR_vseVLvsmuTvsjetT.json of this bundle, at VSjet Tight
# (rawPNetVSjet_2 >= 0.9059), VSe VVLoose (>= 2), VSmu Tight (>= 4). Not official (TauPOG) scale factors: say so when
# the results are shown. Kept as in the exercise, iso_2<0.15 included. Here split as the setup needs it: the mt_1 cut
# is the signalRegion below.
baselineCuts: "(q_1*q_2 < 0) && (iso_1 < 0.15) && (iso_2 < 0.15) && (idDeepTau2018v2p5VSe_2 >= 2) && (idDeepTau2018v2p5VSmu_2 >= 4) && (rawPNetVSjet_2 >= 0.9059) && (dm_2 == 0 || dm_2 == 1 || dm_2 == 10 || dm_2 == 11) && !lepton_vetoes_notau && metfilter"
# Option A (not used), the standard DeepTau path of the docs: the selection of the official scale-factor measurement
# (long-ex config_coarse_TT.yml at VSjet Tight / VSe VVLoose / VSmu Tight), with the official scale factors
#   /eos/cms/store/group/phys_tau/TauFW/pico2024/TES_variations/CMSDAS/TauCorrections_2024_corrTES_noCR.json
#   "q_1*q_2<0 && iso_1<0.15 && idDecayModeNewDMs_2 && idDeepTau2018v2p5VSjet_2>=6 && idDeepTau2018v2p5VSe_2>=2 && idDeepTau2018v2p5VSmu_2>=4 && !lepton_vetoes_notau && metfilter"

regions:
    signalRegion:                 # the only selection of the exercise
        definition: "(mt_1 < 65)"
        title: "signal region"
