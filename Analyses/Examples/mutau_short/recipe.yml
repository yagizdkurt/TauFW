# Example TauFW analysis bundle (short): produce mutau pico tuples of the DY and ttbar samples for 2022_postEE with
# PicoProducer. Production only: a few samples and no data are not enough for control plots (the Histogrammer needs data
# and every background); mutau_long is the same production for every sample the plots need, then the plots.
#   taufw plan    Analyses/Examples/mutau_short               # what would be submitted (nothing is written)
#   taufw start   Analyses/Examples/mutau_short               # new run in run_root (below); submits the jobs
#   taufw advance taufw_runs/mutau_2022_postEE_short_<time>  # later: check, resubmit failed chunks, merge
#   taufw status  taufw_runs/mutau_2022_postEE_short_<time>
name: mutau_2022_postEE_short
# run_root: the parent directory of the runs (<run_root>/<name>_<time>/). It is not set here, so taufw warns and
# the runs go to taufw_runs/ in the directory it is started from. The production stage below writes its merged tuples
# into the run (stages/production/<era>/<group>/), often tens of GB. On lxplus, set it to a directory with enough
# space; the home directory's AFS quota is small:
#   run_root: /afs/cern.ch/work/u/user/taufw_runs     # absolute; ~ and $VARIABLES are not expanded
# (start --run-root DIR takes precedence). EOS as run_root is not tested yet.

pico:
  config: null              # PicoProducer configuration; null: PicoProducer/config/config.json
                            # (a relative path is a file of this bundle, e.g. pico.json)

stages:                     # every stage: stage (type), id (unique), inputs (required), description (optional)
  - stage: production       # NanoAOD -> pico tuples (PicoProducer API)
    id: production
    description: mutau tuples of the DY and ttbar samples
    inputs: null            # production reads no other stage's output
    eras: [2022_postEE]     # eras and channels as in the PicoProducer configuration
    channels: [mutau]
    samples: ["DY*", "TT*"] # glob patterns of sample names; also: vetoes, dtypes, dasfilters, dasvetoes
    tag: ""                 # extra tag in job and output names
    extraopts: []           # KEY=VALUE module options; precedence: channel < sample < these
    split:
      nfilesperjob: null    # files per job (null: sample, then configuration)
      maxevts: null         # events per job, split by events if > 1 (null: sample, then configuration)
    queue: null             # batch queue (HTCondor job flavour); null: configuration
    max_tries: 3            # (re)submissions before failed chunks fail the stage
    merge:
      clean: false          # remove job files and job output after a validated merge
      force: false          # merge samples with failed or missing chunks too
