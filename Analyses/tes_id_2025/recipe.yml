# TauFW analysis bundle: the combined tau energy scale (TES) + tau ID scale factor fit for 2025, on existing pico
# tuples. It runs what Fitter/run_inputs.sh and Fitter/run_workflow_zmm.sh run (option 3: 2D scan of tes and tid_SF
# per decay mode and pt region, with the Z->mumu control region), control plots first, and a summary step last.
#   taufw.py plan    Analyses/tes_id_2025                       # the commands of every stage (nothing runs)
#   taufw.py start   Analyses/tes_id_2025                       # runs plots, histograms, fit, summary (hours)
#   taufw.py status  taufw_runs/tes_id_2025_<time>              # the fitted values
# Everything this analysis reads is in this directory: the .yml configs next to this file replace the module
# configs (whole files), steps/ holds its Python steps. Paths are relative to this directory. A run copies the
# directory to taufw_runs/<run>/bundle/, so editing it later never changes a started run. Copy or send this
# directory to hand over the analysis.
# Needs cmsenv in a CMSSW area with combine and CombineHarvester (FastSetup.sh). The pico tuples are the TauFW
# group's 2025 tuples, named in the inputs of plots and histograms below ({external: <pattern>}; the scripts get
# them as --tuples), including the variation tuples in the same directories (<sample>_mutau_TES0p950.root,
# ..._LTF1p030, ..._JTF0p900, ...). Each stage's scripts run in, and write to,
# taufw_runs/<run>/stages/<id>/ (the fit: stages/fit/<era>/); each command's log goes to taufw_runs/<run>/logs/<id>/.
name: tes_id_2025
# run_root: the parent directory of the runs (<run_root>/<name>_<time>/). It is not set here, so taufw.py warns and
# the runs go to taufw_runs/ in the directory it is started from. On lxplus, set it to a directory with enough
# space; the home directory's AFS quota is small:
#   run_root: /afs/cern.ch/work/u/user/taufw_runs     # absolute; ~ and $VARIABLES ($HOME, $USER) are expanded
# (start --run-root DIR takes precedence). EOS as run_root is not tested yet.

pico:
  config: null              # null: PicoProducer/config/config.json; or a file of this bundle, e.g. pico.json
                            # (not used for the tuples, which the inputs below name)

stages:
  - stage: plots            # data/MC control plots (Plotter/plot.py, run in stages/plots/)
    id: plots
    description: data/MC control plots of the mutau and mumu selections
    inputs:
      tuples: &tuples_2025  # tuples made outside this recipe (no production stage here): <sample>_<channel>.root
        external: /eos/cms/store/group/phys_tau/TauFW/pico2024/TES_variations/$ERA/$GROUP
    eras: [2025]
    configs: [setup_mutau.yml, setup_mumu.yml]   # channel setups (copies of Configs/Plotter/setups/)
    samples: &samples_2025 [v15_2025.yml]   # the samples (MC table, data, weights): a copy of
                            # Configs/Plotter/samples/v15_2025.yml, the same as Plotter/config/samples_v15.py
    variables: [m_vis, pt_1, pt_2, eta_2, dm_2]   # plot.py -V; []: every variable
    selections: [baseline]  # plot.py -S; []: baseline and every region
    pdf: false

  - stage: histograms       # input shapes (Fitter/TauES/createinputsTES.py, run in stages/histograms/)
    id: histograms
    description: TES and tau ID shapes, mutau and the mumu control region
    inputs: {tuples: *tuples_2025}   # the same tuples as the plots (a YAML alias of the input above)
    eras: [2025]
    jet_wps: [VTight]       # DeepTau VSjet working points (run_inputs.sh: J_VALUES)
    ele_wps: [Tight]        # DeepTau VSe working points (run_inputs.sh: E_VALUES)
    configs: [config_coarse_TT.yml, FitSetup_mumu.yml]   # mutau fit, mumu CR (copies of Fitter/TauES*/config/)
    samples: *samples_2025  # the same samples as the plots (a YAML alias)
    serial: false           # createinputsTES.py -s

  - stage: fit              # Fitter/run_workflow_zmm.sh steps, run in stages/fit/<era>/
    id: fit
    description: 2D scan of tes and tid_SF per decay mode and pt region
    inputs: {shapes: histograms}   # the shapes of the histograms stage above
                                   # (or of another run: {path: <run_dir>/stages/histograms}, absolute)
    config: config_coarse_TT.yml
    config_mumu: FitSetup_mumu.yml
    eras: []                # []: the eras and working points of the input shapes
    jet_wps: []
    ele_wps: []
    steps: [fit, postfit, plots, corrections, summary]
    impacts: true           # impacts in the postfit step (slow)
    timeout: null           # seconds per command; null: no limit

  - stage: python           # steps/fit_summary.py, in its own Python process (no ROOT needed)
    id: fit_summary
    description: table of the fitted values
    inputs: {fit: fit}      # ctx.input('fit') in the step: the artifacts of the fit stage
    file: steps/fit_summary.py
    options:
      pois: [tes, tid_SF]   # the parameters to put in the table
