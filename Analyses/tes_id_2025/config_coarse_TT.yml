## Config file for default TES and tid SF fit in mutau channel by DM and pt 
## contact: saskia.falke@cern.ch and oceane.poncet@cern.ch
##

# NOTE: In general, the main information (channel, baselineCuts, etc.) should be given.
# More specific sub-options (like weight replacement for systematic uncertainties) are optional


# Typically, each channel will have its own config file; combination can be done at datacard level

channel: mutau


tag: "_mutau" #"_mutau_mt65_DM_pt_Dt2p5_puppimet"

baselineCuts: "q_1*q_2<0 && iso_1<0.15 && idDecayModeNewDMs_2 && idDeepTau2018v2p5VSjet_2>=5 && idDeepTau2018v2p5VSe_2>=2 && idDeepTau2018v2p5VSmu_2>=4 && !lepton_vetoes_notau && metfilter && mt_1<65 "
# idDeepTau2018v2p5VSjet_2>=5 = Medium WP
# idDeepTau2018v2p5VSe_2>=2 = VVLoose WP
# idDeepTau2018v2p5VSmu_2>=4 = Tight WP


# These regions will be defined when creating inputs or making plots
# At this point, they do not need to be exclusive; 
# PLEASE NOTE:
#     - which regions are included in the fit will be defined in obervables section --> adjust when changing regions
#     - additional cross section scale factors applied to some processes need to be given in these regions to be considered --> adjust in scaleFactors section
#[20.,25.,30.,35.,40.,50.,60.,80.,100.,200.]

regions:
    # DM0:
    #   definition: "dm_2==0"
    #   title: "h^{#pm}"
    # DM1:
    #   definition: "dm_2==1"    
    #   title: "h^{#pm}#pi^{0}"
    # DM10:
    #   definition: "dm_2==10"
    #   title: "h^{#pm}h^{#mp}h^{#pm}"
    # DM11:
    #   definition: "dm_2==11"
    #   title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}" 
    DM0_pt1: 
        definition: "dm_2==0 && pt_2>20 && pt_2<40"
        title: "h^{#pm}, pt: 20-40"
    DM0_pt2:
        definition: "dm_2==0 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}, pt: 40-60"
    DM0_pt3:
        definition: "dm_2==0 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}, pt: 60-200"
        binning: [11, 40, 150] # Coarser binning for high pt
    DM1_pt1: 
        definition: "dm_2==1 && pt_2>20 && pt_2<40"
        title: "h^{#pm}#pi^{0}, pt: 20-40"
    DM1_pt2:
        definition: "dm_2==1 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}#pi^{0}, pt: 40-60"
    DM1_pt3:
        definition: "dm_2==1 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}#pi^{0}, pt: 60-200"
        binning: [11, 40, 150] 
    DM10_pt1: 
        definition: "dm_2==10 && pt_2>20 && pt_2<40"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 20-40"
    DM10_pt2:
        definition: "dm_2==10 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 40-60"
    DM10_pt3:
        definition: "dm_2==10 && pt_2>=60 && pt_2<200"
        title: "h^{#pm}h^{#mp}h^{#pm}, pt: 60-200"
        binning: [11, 40, 150] 
    DM11_pt1: 
        definition: "dm_2==11 && pt_2>20 && pt_2<40"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 20-40"
    DM11_pt2:
        definition: "dm_2==11 && pt_2>=40 && pt_2<60"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 40-60"
    DM11_pt3:
        definition: "dm_2==11 && pt_2>60 && pt_2<200"
        title: "h^{#pm}h^{#mp}h^{#pm}#pi^{0}, pt: 60-200"
        binning: [11, 40, 150] 

plottingOrder: &region_list 
          [ 
            # "DM0", 
            #    "DM1", 
            #  "DM10", 
            #  "DM11",
            "DM0_pt1", 
            "DM0_pt2", 
            "DM0_pt3", 
            "DM1_pt1", 
            "DM1_pt2", 
            "DM1_pt3", 
            "DM10_pt1", 
            "DM10_pt2", 
            "DM10_pt3", 
            "DM11_pt1", 
            "DM11_pt2", 
            "DM11_pt3",
               ]


# Observable: to be fitted and plotted
# binning: as defined in TH1 (nbins, xmin, xmax)
# regions: (defined separately) to be included in the fit for this observable

observables:
    m_vis:
        binning: [22, 40, 150] #binning=10GeV
        title: "m_{vis}"
        extra:
            cut: "40<m_vis && m_vis<150"
        fitRegions:  *region_list
        scanRegions: *region_list
# Assume that this code is meant to fit TES variations; more options could be added when adding other POIs

TESvariations:
    # values : [ 0.970,  0.976, 0.982, 0.988, 0.990, 0.992, 0.994, 0.996, 0.998, 1.000, 1.002, 1.004, 1.006, 1.008, 1.010, 1.016,  1.022, 1.028] 
    # values : [0.950, 0.960 ,0.970, 0.980, 0.990,0.996, 1.004, 1.010, 1.020, 1.030, 1.040, 1.050] 
    # values : [0.950, 0.960 ,0.970, 0.980, 0.990, 1.010, 1.020, 1.030, 1.040, 1.050] 

    # values : [0.950 ,0.970, 0.980, 0.990, 1.010, 1.020, 1.030,  1.050] 
    values : [0.950, 0.960 ,0.970, 0.980, 0.990, 1.010, 1.020, 1.030, 1.040, 1.050]  
     
    
    processes: ["ZTT"] #,"TTT"] # as well??? 

# Should add bin-by-bin variations (stat. uncertainties) for signal and backgrounds?

fitSpecs:
    doBBB: doShapes
    signalBBB: True
    backgroundBBB: True


# Samples to be used and association to processes entering analysis
# Possibility to remove or add specific weights / SFs from global weight

samples:
    filename: "$PICODIR/$SAMPLE_$CHANNEL$TAG.root"
    join: ["VV","TT","ST"]
    split:
        DY: [ ["ZTT","genmatch_2==5"], ["ZL","genmatch_2>0 && genmatch_2<5"], ["ZJ","genmatch_2==0"] ]
        TT: [["TTT","genmatch_2==5"], ["TTL","genmatch_2>0 && genmatch_2<5"], ["TTJ","genmatch_2==0"] ]
        #ST: [("STT","genmatch_2==5"),("STJ","genmatch_2<5")]
    rename:
        WJ: "W"
    data: "data_obs"
    removeSFs: ["idweight_2"]

tesRegions:
    DM0:
       title: "DM0"
    DM1:
       title: "DM1"
    DM10:
       title: "DM10"
    DM11:
       title: "DM11"

    DM0_pt1: 
        title: "DM0 20<p_{t_{#tau}}<40"
    DM0_pt2: 
        title: "DM0 40<=p_{t_{#tau}}<60"
    DM0_pt3:
        title: "DM0 60<=p_{t_{#tau}}<200"

    DM1_pt1: 
        title: "DM1 20<p_{t_{#tau}}<40"
    DM1_pt2: 
        title: "DM1 40<=p_{t_{#tau}}<60"
    DM1_pt3:
        title: "DM1 60<=p_{t_{#tau}}<200"

    DM10_pt1: 
        title: "DM10 20<p_{t_{#tau}}<40"
    DM10_pt2: 
        title: "DM10 40<=p_{t_{#tau}}<60"
    DM10_pt3:
        title: "DM10 60<=p_{t_{#tau}}<200"

    DM11_pt1: 
        title: "DM11 20<p_{t_{#tau}}<40"
    DM11_pt2: 
        title: "DM11 40<=p_{t_{#tau}}<60"
    DM11_pt3:
        title: "DM11 60<=p_{t_{#tau}}<200"

tid_SFRegions:
    DM0:
       title: "DM0"
    DM1:
       title: "DM1"
    DM10:
       title: "DM10"
    DM11:
       title: "DM11"
    DM0_pt1: 
        title: "DM0 20<p_{t_{#tau}}<40"
    DM0_pt2: 
        title: "DM0 40<=p_{t_{#tau}}<60"
    DM0_pt3:
        title: "DM0 60<=p_{t_{#tau}}<200"

    DM1_pt1: 
        title: "DM1 20<p_{t_{#tau}}<40"
    DM1_pt2: 
        title: "DM1 40<=p_{t_{#tau}}<60"
    DM1_pt3:
        title: "DM1 60<=p_{t_{#tau}}<200"

    DM10_pt1: 
        title: "DM10 20<p_{t_{#tau}}<40"
    DM10_pt2: 
        title: "DM10 40<=p_{t_{#tau}}<60"
    DM10_pt3:
        title: "DM10 60<=p_{t_{#tau}}<200"

    DM11_pt1: 
        title: "DM11 20<p_{t_{#tau}}<40"
    DM11_pt2: 
        title: "DM11 40<=p_{t_{#tau}}<60"
    DM11_pt3:
        title: "DM11 60<=p_{t_{#tau}}<200"



# Processes taken into account in analysis

processes: ["ZTT","ZL","ZJ","W","VV","ST","TTT","TTL","TTJ","QCD","data_obs"]

# Systematic uncertainties: can have effect shape or lnN (normalisation)

systematics:
    LTF:
        effect: "shape"
        processes: ["ZL", "TTL"]
        name: "shape_mTauFake_$BIN"
        title: "+/- 3% LTF shape"
        variations: ["Up", "Down"]
        sampleAppend: ["_LTF1p030","_LTF0p970"]
    JTF:
        effect: "shape"
        processes: ["ZJ", "TTJ", "W"]
        name: "shape_jTauFake_$BIN"
        title: "+/- 10% JTF"
        variations: ["Up", "Down"]
        sampleAppend: ["_JTF1p100","_JTF0p900"]
    # shape_dy: #<-- check if this is ok
    #     effect: "shape"
    #     processes: ["ZTT", "ZL", "ZJ"] #"ZTT",
    #     name: "shape_dy_$BIN"
    #     title: "+/- 5% Zptweight"
    #     variations: ["Up100", "No", "Up10", "Down10"]
    #     nomWeight: "zptweight_nnlo" 
    #     altWeights: ["((2*(zptweight_nnlo)) - 1)", "1", "((1.1*zptweight_nnlo) - 0.1)", "((0.9*zptweight_nnlo) + 0.1)"]
    # shape_ttbar: #<-- check if this is ok
    #     effect: "shape"
    #     processes: [ "TTT", "TTL", "TTJ"]
    #     name: "shape_ttbar_$BIN"
    #     title: "+/- 3% ttptweight"
    #     variations: ["Up", "Down"]
    #     nomWeight: "ttptweight" 
    #     altWeights: ["pow(ttptweight,1.03)", "pow(ttptweight,0.97)"]
    lumi:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"] #processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"]
        scaleFactor: 1.025
    eff_m:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"]
        scaleFactor: 1.02
    muonFakerate:
        effect: "lnN"
        processes: ["ZL", "TTL"]
        scaleFactor: 1.50
    xsec_dy:
       effect: "lnN"
       processes: ["ZTT", "ZL", "ZJ"]
       scaleFactor: 1.02
    xsec_tt:
        effect: "lnN"
        processes: ["TTT", "TTL", "TTJ"]
        scaleFactor: 1.06
    xsec_st:
        effect: "lnN"
        processes: ["ST"]
        scaleFactor: 1.05
    xsec_vv:
        effect: "lnN"
        processes: ["VV"]
        scaleFactor: 1.05
    norm_wj:
        effect: "lnN"
        processes: ["W"]
        scaleFactor: 1.08
    norm_qcd:
        effect: "lnN"
        processes: ["QCD"]
        scaleFactor: 1.20 # mettre 20 % ?s
    rate_jTauFake_$BIN:
        effect: "lnN"
        processes: ["W","QCD","ZJ","TTJ"]
        scaleFactor: 1.15

