# Example TauFW analysis bundle: produce mutau pico tuples for 2022_postEE with PicoProducer, then control plots.
#   taufw.py plan    Analyses/example_mutau                     # what would be submitted (nothing is written)
#   taufw.py start   Analyses/example_mutau                     # new run in taufw_runs/; submits the jobs
#   taufw.py advance taufw_runs/mutau_2022_postEE_<time>        # later: check, resubmit failed chunks, merge,
#                                                               # then the plots
#   taufw.py status  taufw_runs/mutau_2022_postEE_<time>
name: mutau_2022_postEE

pico:
  config: null              # PicoProducer configuration; null: PicoProducer/config/config.json
                            # (a relative path is a file of this bundle, e.g. pico.json)

stages:
  - stage: production       # NanoAOD -> pico tuples (PicoProducer API)
    eras: [2022_postEE]     # eras and channels as in the PicoProducer configuration
    channels: [mutau]
    samples: ["DY*", "TT*"] # glob patterns of sample names; also: vetoes, dtypes, dasfilters, dasvetoes
    tag: ""                 # extra tag in job and output names
    extraopts: []           # KEY=VALUE module options; precedence: channel < sample < these
    split:
      nfilesperjob: null    # files per job (null: sample, then configuration)
      maxevts: null         # events per job, split by events if > 1 (null: sample, then configuration)
    queue: null             # batch queue (HTCondor job flavour); null: configuration
    max_tries: 3            # (re)submissions before failed chunks fail the stage
    merge:
      clean: false          # remove job files and job output after a validated merge
      force: false          # merge samples with failed or missing chunks too

  - stage: plots            # data/MC control plots of the merged tuples (Plotter/plot.py, run locally)
    eras: [2022_postEE]     # plot.py -y; the tuples are found through $PICODIR of the PicoProducer configuration
    configs: [setup_mutau.yml]  # bundle files, channel names (Plotter/config/setup_<channel>.yml)
                            # or .yml files relative to Plotter/
    variables: [m_vis, pt_1, pt_2]  # plot.py -V filters (glob patterns); []: all variables of plot.py
    selections: []          # plot.py -S filters; []: baseline and every region of the setup
    pdf: false              # also save pdf files; output: Plotter/plots/2022_postEE/
