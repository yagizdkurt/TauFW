# TauFW recipe: the combined tau energy scale (TES) + tau ID scale factor fit for 2025, on existing pico tuples.
# It runs what Fitter/run_inputs.sh and Fitter/run_workflow_zmm.sh run (option 3: 2D scan of tes and tid_SF per
# decay mode and pt region, with the Z->mumu control region), plus control plots first.
#   taufw.py plan    Framework/recipes/tes_id_2025.yml          # the commands of every stage (nothing runs)
#   taufw.py start   Framework/recipes/tes_id_2025.yml          # runs plots, histograms and fit (takes hours)
#   taufw.py status  taufw_runs/tes_id_2025_<time>              # the fitted values
# Needs cmsenv in a CMSSW area with combine and CombineHarvester (FastSetup.sh). The scripts read the pico tuples
# through $PICODIR of PicoProducer/config/config.json, including the variation tuples (<sample>_mutau_TES0p950.root,
# ..._LTF1p030, ..._JTF0p900, ...). Their outputs go to Plotter/plots/ and Fitter/ (shared by all runs); each
# command's log goes to taufw_runs/<run>/<stage>/.
name: tes_id_2025

pico:
  config: null              # the scripts always read PicoProducer/config/config.json

stages:
  - stage: plots            # data/MC control plots (Plotter/plot.py, run in Plotter/)
    eras: [2025]
    configs: [mutau, mumu]  # Plotter/config/setup_<channel>.yml
    variables: [m_vis, pt_1, pt_2, eta_2, dm_2]   # plot.py -V; []: every variable
    selections: [baseline]  # plot.py -S; []: baseline and every region
    pdf: false

  - stage: histograms       # input shapes (Fitter/TauES/createinputsTES.py, run in Fitter/)
    eras: [2025]
    jet_wps: [VTight]       # DeepTau VSjet working points (run_inputs.sh: J_VALUES)
    ele_wps: [Tight]        # DeepTau VSe working points (run_inputs.sh: E_VALUES)
    configs: [TauES_ID/config/config_coarse_TT.yml, TauES/config/FitSetup_mumu.yml]   # mutau fit, mumu CR
    serial: false           # createinputsTES.py -s

  - stage: fit              # Fitter/run_workflow_zmm.sh steps, run in Fitter/
    config: TauES_ID/config/config_coarse_TT.yml
    config_mumu: TauES/config/FitSetup_mumu.yml
    eras: []                # []: the eras and working points of the histograms stage
    jet_wps: []
    ele_wps: []
    steps: [fit, postfit, plots, corrections, summary]
    impacts: true           # impacts in the postfit step (slow)
    timeout: null           # seconds per command; null: no limit
